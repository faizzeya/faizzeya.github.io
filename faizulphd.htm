<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PhD Scholar Faiz ul haque Zeya</title>
<meta name="description" content="PhD Scholar Faiz ul haque Zeya — research interests in Large Language Models and Agentic AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #0B1B2B;
    --paper: #F6F4EE;
    --paper-tint: #EFEBE0;
    --teal: #0E7A6C;
    --teal-soft: #C8E6E0;
    --teal-deep: #084E47;
    --amber: #C77A30;
    --rule: rgba(11, 27, 43, 0.10);
    --muted: #4A5A6B;
    --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #F6F4EE;
      --paper: #0B1B2B;
      --paper-tint: #11263A;
      --teal: #4FC1B0;
      --teal-soft: #123E3A;
      --teal-deep: #7FD8CB;
      --rule: rgba(246, 244, 238, 0.12);
      --muted: #A9B6C3;
      --card: #102336;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--teal); text-decoration: none; }
  a:hover { text-decoration: underline; }

  nav {
    border-bottom: 1px solid var(--rule);
    padding: 1rem 0;
  }
  .shell { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }
  nav .shell { display: flex; justify-content: space-between; align-items: center; }
  .mark { font-family: 'Instrument Serif', serif; font-size: 1.5rem; color: var(--ink); }
  .mark em { color: var(--teal); }
  .back { font-size: 0.9rem; font-weight: 500; }

  header {
    padding: 6rem 0 4rem;
    border-bottom: 1px solid var(--rule);
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 1.25rem;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 7vw, 4.75rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  h1 em { color: var(--teal); }

  main { flex: 1; padding: 4rem 0 5rem; }
  h2 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 2.25rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  .interests {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 2rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px -16px rgba(11, 27, 43, 0.25); }
  .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--teal);
    background: var(--teal-soft);
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }
  .card h3 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 1.9rem;
    line-height: 1.15;
  }

  footer {
    border-top: 1px solid var(--rule);
    padding: 1.5rem 0;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<nav>
  <div class="shell">
    <a href="index.html" class="mark">Faiz <em>Zeya</em></a>
    <a href="index.html" class="back">← Back to home</a>
  </div>
</nav>

<header>
  <div class="shell">
    <p class="eyebrow">Doctoral Research</p>
    <h1>PhD Scholar<br><em>Faiz ul haque Zeya</em></h1>
  </div>
</header>

<main>
  <div class="shell">
    <h2>Area of Interest</h2>
    <div class="interests">
      <div class="card">
        <span class="num">01</span>
        <h3>Large Language Models</h3>
      </div>
      <div class="card">
        <span class="num">02</span>
        <h3>Agentic AI</h3>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="shell">© Faiz ul haque Zeya · <a href="index.html">faizzeya.github.io</a></div>
</footer>

</body>
</html>
